server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match the backend's 50 MB file-size limit (add a small buffer)
    client_max_body_size 55m;

    # Proxy all /api/* requests to the backend container.
    # "backend" resolves via Docker Compose's internal DNS.
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # allow slow OCR / large file processing
        proxy_send_timeout 300s;
    }

    # React SPA fallback — all unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
